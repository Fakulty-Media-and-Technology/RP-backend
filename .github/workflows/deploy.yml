name: CI/CD Pipeline

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install


      # - name: Run Linter
      #   run: npm run lint

      # - name: Run Formatter
      #   run: npm run format

      - name: Build the Project
        run: npm run build

      - name: Run Tests
        run: npm test

  cd:
    needs: ci  # <- This ensures CD runs only if CI succeeds
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4 # Checks out the repository code.
  
        - name: Deploy to Server
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.ssh_server }} # Your server IP or hostname, stored as a secret.
            username: ${{ secrets.ssh_username }} # SSH username, stored as a secret.
            password: ${{ secrets.ssh_password }} # SSH password, stored as a secret.
            port: 22 # Optional. Default SSH port 22 is used unless changed.
            script: |
              echo "Deploying to ${{ github.ref_name }}..."
  
              # Map branch to Docker container
              if [ "${{ github.ref_name }}" = "typescript" ]; then
                container_name="app2"
                branch="typescript"
              else
                echo "Unknown branch. Exiting."
                exit 1
              fi
  
              docker exec ${container_name} /bin/bash -c "
                  git fetch origin && \
                  git reset --hard HEAD && \
                  git checkout ${branch} && \
                  git reset --hard origin/${branch} && \
                  git pull --rebase --no-edit
              "
  
              # Restart the Docker container
              docker restart ${container_name}
  
