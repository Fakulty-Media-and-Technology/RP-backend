version: '3.8'

services:
  reeplay:
    build:
      context: .
      dockerfile: Dockerfile.nginx-rtmp
    container_name: reeplay-rtmp
    ports:
      - '1936:1936'
      - '8080:8080'
    environment:
      # - NODE_ENV=development
      # - VERSION=1.0.0
      # - MONGO_DB_URL=mongodb://root:reeplaypass@mongodb:27017/reeplayDB?authSource=admin
    restart: unless-stopped
    networks:
      - reeplay


volumes:
  mongodb_data:

networks:
  reeplay:
    name: reeplay

# docker compose -f rtmp-compose.yml up -d