version: '3.8'

services:
  reeplay:
    build:
      context: .
      dockerfile: Dockerfile.nginx-rtmp
    container_name: reeplay-rtmp
    ports:
      - '1935:1935'
      - '8080:8080'
    restart: unless-stopped
    networks:
      - reeplay


volumes:
  mongodb_data:

networks:
  reeplay:
    name: reeplay

