events {
    worker_connections 1024;
}

http {
    # Enable gzip compression
    gzip on;

    # Minimum file size to compress (1KB)
    gzip_min_length 1024;

    # Compression level (1-9, higher = more compression but more CPU)
    gzip_comp_level 6;

    # Enable compression for proxied requests
    gzip_proxied any;

    # Vary header for caching
    gzip_vary on;

    # Compress these MIME types
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom_xml;

    # Disable gzip for old IE browsers
    gzip_disable "msie6";

    # Add buffers for better performance
    gzip_buffers 16 8k;

    # HTTP version
    gzip_http_version 1.1;

    server {
        listen 3001;
        server_name localhost;

        # Access and error logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Allow Bootstrap assets loaded from CDN while keeping a restrictive baseline CSP.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://unpkg.com; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://unpkg.com; img-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        # Proxy settings for Node.js app (same container)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            # Preserve original request headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy caching for dynamic content
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
