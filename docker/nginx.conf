worker_processes auto;
rtmp_auto_push on;
error_log /var/log/nginx/error.log info;

# RTMP Domain: obs.reeplay.app
# Streamers connect to: rtmp://obs.reeplay.app:1935/live/{stream_key}
# Viewers access HLS at: http://obs.reeplay.app:8080/hls/{stream_key}/index.m3u8

events {
    worker_connections 1024;
}

# RTMP configuration for live streaming
rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;
        chunk_size 4096;
        ping 30s;
        ping_timeout 10s;

        # Live streaming application
        application live {
            live on;
            record off;

            # HLS output
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Multiple quality variants (adaptive bitrate)
            # 360p
            exec_push ffmpeg -i rtmp://localhost:1935/live/$name
                -vf scale=w=640:h=360:force_original_aspect_ratio=decrease
                -c:a aac -ar 48000 -c:v libx264 -preset veryfast
                -profile:v main -crf 20 -sc_threshold 0 -g 48 -keyint_min 48
                -hls_time 6 -hls_list_size 10 -hls_flags delete_segments
                -b:v 800k -maxrate 856k -bufsize 1200k -b:a 96k
                -f flv rtmp://localhost:1935/hls/$name_360p;

            # 480p
            exec_push ffmpeg -i rtmp://localhost:1935/live/$name
                -vf scale=w=842:h=480:force_original_aspect_ratio=decrease
                -c:a aac -ar 48000 -c:v libx264 -preset veryfast
                -profile:v main -crf 20 -sc_threshold 0 -g 48 -keyint_min 48
                -hls_time 6 -hls_list_size 10 -hls_flags delete_segments
                -b:v 1400k -maxrate 1498k -bufsize 2100k -b:a 128k
                -f flv rtmp://localhost:1935/hls/$name_480p;

            # 720p
            exec_push ffmpeg -i rtmp://localhost:1935/live/$name
                -vf scale=w=1280:h=720:force_original_aspect_ratio=decrease
                -c:a aac -ar 48000 -c:v libx264 -preset veryfast
                -profile:v main -crf 20 -sc_threshold 0 -g 48 -keyint_min 48
                -hls_time 6 -hls_list_size 10 -hls_flags delete_segments
                -b:v 2800k -maxrate 2996k -bufsize 4200k -b:a 128k
                -f flv rtmp://localhost:1935/hls/$name_720p;
        }

        # HLS application for transcoded streams
        application hls {
            live on;
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_nested on;
            hls_cleanup on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/vnd.apple.mpegurl
        video/mp2t;
    gzip_disable "msie6";
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    server {
        listen 8080;
        server_name obs.reeplay.app localhost;

        # Access and error logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # HLS stream serving
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # RTMP stats (optional, for monitoring)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
