worker_processes auto;
rtmp_auto_push on;
# Log to stdout so docker logs captures everything
error_log /dev/stdout warn;

# RTMP Domain: rtmp.reeplay.app
# Streamers connect to: rtmp://rtmp.reeplay.app/live/{stream_key}
# HLS playback at: https://tslive.reeplay.app/hls/{stream_key}/index.m3u8

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

rtmp {
    server {
        listen 1936;
        listen [::]:1936 ipv6only=on;
        chunk_size 8192;
        ping 30s;
        ping_timeout 10s;

        application live {
            live on;
            record off;
            max_connections 1000;

            # Log stream events to stdout for docker logs
            # on_publish exec /bin/bash -c 'echo "[$(date "+%Y-%m-%d %H:%M:%S")] [RTMP PUBLISH] ✓ Stream started: $name | Client IP: $addr"';
            # on_publish_done exec /bin/bash -c 'echo "[$(date "+%Y-%m-%d %H:%M:%S")] [RTMP DONE] ✓ Stream ended: $name"';
            # on_play exec /bin/bash -c 'echo "[$(date "+%Y-%m-%d %H:%M:%S")] [HLS PLAY] ✓ Stream being pulled: $name | Client IP: $addr"';
            # on_play_done exec /bin/bash -c 'echo "[$(date "+%Y-%m-%d %H:%M:%S")] [HLS STOP] ✓ HLS session ended: $name"';

            # HLS configuration with error handling
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 24s;
            hls_nested on;
            hls_cleanup on;
            hls_sync 100ms;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 0;

    # Enhanced log format for HLS pulls
    log_format hls_log '[HLS] $time_iso8601 | Client: $remote_addr | Stream: $request_uri | Status: $status | Size: $body_bytes_sent bytes | Time: ${request_time}s';

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/vnd.apple.mpegurl;
    gzip_disable "msie6";
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    server {
        listen 8080;
        server_name stream.reeplay.app rtmp.reeplay.app localhost;

        access_log /dev/stdout hls_log;
        error_log /dev/stdout warn;

        # Capture failed requests
        log_not_found off;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /tmp/hls;
            add_header Access-Control-Allow-Origin *;

            location ~* \.m3u8$ {
                add_header Cache-Control no-cache;
                add_header Access-Control-Allow-Origin *;
            }
            location ~* \.ts$ {
                add_header Cache-Control max-age=600;
                add_header Access-Control-Allow-Origin *;
            }
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}