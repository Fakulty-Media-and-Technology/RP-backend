worker_processes auto;
rtmp_auto_push on;
error_log /var/log/nginx/error.log info;

# RTMP Domain: rtmp.reeplay.app
# Streamers connect to: rtmp://rtmp.reeplay.app/live/{stream_key}
# HLS playback at: https://tslive.reeplay.app/hls/{stream_key}/index.m3u8

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

rtmp {
    server {
        listen 1936;
        listen [::]:1936 ipv6only=on;
        chunk_size 8192;
        ping 30s;
        ping_timeout 10s;

        application live {
            live on;
            record off;

            # Stream key auth
            # on_publish http://localhost:3000/on_publish; UNCOMMENT AFTER CONECCTION SUCCESS
            # on_publish_done http://localhost:3000/on_publish_done; NOT IMPLEMNETED BUT MIGHT BE

            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 24s;
            hls_nested on;
            hls_cleanup on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/vnd.apple.mpegurl;
    gzip_disable "msie6";
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    server {
        listen 8080;
        server_name tslive.reeplay.app rtmp.reeplay.app localhost;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /tmp/hls;
            add_header Access-Control-Allow-Origin *;

            location ~* \.m3u8$ {
                add_header Cache-Control no-cache;
                add_header Access-Control-Allow-Origin *;
            }
            location ~* \.ts$ {
                add_header Cache-Control max-age=600;
                add_header Access-Control-Allow-Origin *;
            }
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/local/nginx/html;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}