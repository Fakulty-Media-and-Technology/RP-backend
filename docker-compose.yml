version: '3.8'

services:
  rtmp:
    build:
      context: .
      dockerfile: Dockerfile.nginx-rtmp
    container_name: rtmp-server
    ports:
      - '1936:1936'
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    networks:
      - reeplay

networks:
  reeplay:
    name: reeplay
