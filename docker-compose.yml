version: '3.8'

services:
  reeplay:
    build:
      context: .
      dockerfile: Dockerfile  
    container_name: reeplay
    ports:
      - "3000:3000"
      - "1936:1936"
      - "3445:3445"
    environment:
      - NODE_ENV=development
      # - VERSION=1.0.0
      # - MONGO_DB_URL=mongodb://root:reeplaypass@mongodb:27017/reeplayDB?authSource=admin
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - reeplay

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: reeplaypass
      MONGO_INITDB_DATABASE: reeplayDB
    volumes:
      - mongodb_data:/data/
      # - ./mongo-backup:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    networks:
      - reeplay

volumes:
  mongodb_data:

networks:
  reeplay:
    name: reeplay